# crawl-vm 配置文件
# 完全运行在 VM 上，不依赖 Mac

vault: /home/ubuntu/webdav/steven_vault

# 关键路径
skills_path: /home/ubuntu/.agents/skills/crawl

# 平台配置
platforms:
  douyin:
    enabled: true
    cookie_file: /home/ubuntu/.agents/credentials/ominicrawl/douyin.txt
    # Cookie 从 config.yaml 的 TokenManager 段读取
    cookie_config: /home/ubuntu/.dsh/skills/crawl/ingest-douyin/douyin_api/crawlers/douyin/web/config.yaml
    # 只爬最近 N 天发布的视频 (对齐 Mac 版 7 天窗口); 0 = 不过滤(补历史用)
    recent_days: 7
  bilibili:
    enabled: true
    cookie_file: /home/ubuntu/.agents/credentials/ominicrawl/bilibili.txt
  xiaohongshu:
    enabled: true
    cookie_file: /home/ubuntu/.agents/credentials/ominicrawl/xiaohongshu.txt

# 转录配置 (freellmapi 主路径 + Groq fallback)
# 主路径走 freellmapi localhost:31415 (它内部 router 自动选 groq/cloudflare whisper)
# Fallback 直连 Groq (需 VPN), 仅当 freellmapi 不可达时启用
transcription:
  model: whisper-1     # freellmapi 推荐 "whisper-1" 或 "auto" (让 router 决定)
  proxy: http://127.0.0.1:7890  # Groq fallback 用的 VPN 代理
  language: zh
  freellmapi_timeout: 120  # freellmapi 转录超时 (秒)
  fallback_to_groq: true   # freellmapi 挂了是否回退到 Groq 直连

# 总结配置 (Groq LLM)
summarization:
  model: qwen/qwen3.8-27b
  max_tokens: 1024
  temperature: 0.3
  min_chars: 300

# 代理配置
vm:
  proxy: http://127.0.0.1:7890

# 爬虫配置
crawler:
  # 同一 IP 请求间隔（秒），防止被风控
  request_delay: 2
  # 最大重试次数
  max_retries: 3
  # 单次最多处理视频数（0 = 不限制）
  max_videos_per_author: 0
